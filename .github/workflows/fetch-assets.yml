name: Fetch site images

on:
  workflow_dispatch:
  push:
    branches:
      - claude/allison-kourbage-law-website-25ch3c
    paths:
      - ".github/workflows/fetch-assets.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and optimize images
        run: |
          set -euo pipefail
          mkdir -p img /tmp/src
          curl -fsSL -o /tmp/src/hero.png    "https://d8j0ntlcm91z4.cloudfront.net/user_3GYBS62dxIIG18Q4M3dG53faoa7/hf_20260727_200306_bd8ff57a-1d4c-4562-91f3-c9ef4f018a85.png"
          curl -fsSL -o /tmp/src/closing.png "https://d8j0ntlcm91z4.cloudfront.net/user_3GYBS62dxIIG18Q4M3dG53faoa7/hf_20260727_200307_44d02bee-ee11-4d9c-990b-92ba31ed462c.png"
          curl -fsSL -o /tmp/src/harbor.png  "https://d8j0ntlcm91z4.cloudfront.net/user_3GYBS62dxIIG18Q4M3dG53faoa7/hf_20260727_200316_558c7c2a-7e3c-44a0-a709-0193385f621d.png"
          curl -fsSL -o /tmp/src/office.png  "https://d8j0ntlcm91z4.cloudfront.net/user_3GYBS62dxIIG18Q4M3dG53faoa7/hf_20260727_200318_79462d51-0dfc-4f87-8d9a-ff34c5278438.png"
          python3 -m pip install --quiet pillow
          python3 - <<'EOF'
          from PIL import Image
          jobs = [
              ("/tmp/src/hero.png",    "img/hero-home.jpg", 1920, 82),
              ("/tmp/src/closing.png", "img/closing.jpg",   1200, 82),
              ("/tmp/src/harbor.png",  "img/harbor.jpg",    1920, 80),
              ("/tmp/src/office.png",  "img/office.jpg",    1200, 82),
          ]
          for src, dst, width, quality in jobs:
              im = Image.open(src).convert("RGB")
              if im.width > width:
                  im = im.resize((width, round(im.height * width / im.width)), Image.LANCZOS)
              im.save(dst, "JPEG", quality=quality, optimize=True, progressive=True)
          EOF
          ls -la img/

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/
          git diff --cached --quiet || git commit -m "Add optimized site photography"
          git push
