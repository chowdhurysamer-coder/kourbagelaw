name: Fetch site images

on:
  workflow_dispatch:
  push:
    branches:
      - claude/allison-kourbage-law-website-25ch3c
    paths:
      - ".github/workflows/fetch-assets.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and optimize images
        run: |
          set -euo pipefail
          mkdir -p img /tmp/src
          curl -fsSL -o /tmp/src/door.png "https://d8j0ntlcm91z4.cloudfront.net/user_3GYBS62dxIIG18Q4M3dG53faoa7/hf_20260727_210839_15309627-ca1c-4c08-bbed-d266b0c786f8.png"
          python3 -m pip install --quiet pillow
          python3 - <<'EOF'
          from PIL import Image
          im = Image.open("/tmp/src/door.png").convert("RGB")
          if im.width > 800:
              im = im.resize((800, round(im.height * 800 / im.width)), Image.LANCZOS)
          im.save("img/door.jpg", "JPEG", quality=82, optimize=True, progressive=True)
          EOF
          ls -la img/

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/
          git diff --cached --quiet || git commit -m "Add practice section photo"
          git push
